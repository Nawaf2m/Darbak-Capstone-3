spring.application.name=Tuwaiq Capstone 3

spring.datasource.url=jdbc:mysql://localhost:3306/capstone3
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect




spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

server.web.error.include-message=always
server.web.error.include-stacktrace=always

openrouter.api-key=${OPENROUTER_API_KEY}

football.api.url=https://v3.football.api-sports.io
football.api.key=${FOOTBALL_API_KEY}

ultramsg.instance=${ULTRAMSG_INSTANCE}
ultramsg.token=${ULTRAMSG_TOKEN} 

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true