spring.application.name=Tuwaiq Capstone 3

spring.datasource.url=jdbc:mysql://localhost:3306/capstone3
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect




spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

server.web.error.include-message=always
server.web.error.include-stacktrace=always

openrouter.api-key=${OPENROUTER_API_KEY:disabled}

football.api.url=https://v3.football.api-sports.io
football.api.key=${FOOTBALL_API_KEY}

gemini.api.key=${GEMINI_API_KEY}

ultramsg.instance=disabled
ultramsg.token=disabled

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com